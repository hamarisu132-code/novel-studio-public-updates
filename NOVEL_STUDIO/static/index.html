<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVEL STUDIO</title><style>
:root{--bg:#0d1017;--panel:#161b25;--panel2:#1c2330;--gold:#d9b776;--text:#e9e6df;--muted:#99a0ac;--border:#343640}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Yu Gothic','Meiryo',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}header{height:68px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#121720}.brand{font-family:Georgia,serif;letter-spacing:3px;color:var(--gold);font-size:21px}.shell{display:flex;min-height:calc(100vh - 68px)}nav{width:225px;flex-shrink:0;border-right:1px solid var(--border);background:#111620;padding:22px 12px}nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);padding:14px 16px;border-radius:8px;margin-bottom:5px}nav button.active,nav button:hover{background:#292b31;color:var(--gold)}main{width:100%;max-width:1240px;margin:auto;padding:30px 38px;align-self:flex-start}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}h1{font-size:26px;font-weight:500;margin:0 0 8px}h2{font-size:18px;font-weight:500;margin:0 0 15px;color:var(--gold)}p{color:var(--muted);line-height:1.7}.muted{color:var(--muted);font-size:13px}.btn{background:var(--gold);border:1px solid var(--gold);color:#171716;padding:10px 17px;border-radius:7px;font-weight:bold}.btn.secondary{background:transparent;color:var(--gold)}.btn.danger{border-color:#9a6262;color:#efb6b6;background:transparent}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:var(--panel);border:1px solid var(--border);padding:20px;border-radius:11px}.card.click{cursor:pointer}.card.click:hover{border-color:var(--gold)}.big{font-size:30px;color:var(--gold);margin:8px 0}.flex{display:flex;gap:15px;align-items:center;flex-wrap:wrap}.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.list{display:flex;flex-direction:column;gap:8px}.item{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:13px;cursor:pointer}.item.selected{border-color:var(--gold);background:#27252a}.item strong{display:block;margin-bottom:5px}input,textarea,select{background:#10151e;border:1px solid var(--border);border-radius:7px;color:var(--text);padding:11px 12px;outline:none;width:100%}input:focus,textarea:focus,select:focus{border-color:var(--gold)}textarea{resize:vertical;line-height:1.9}label{display:block;color:var(--muted);font-size:13px;margin:15px 0 6px}.editor{min-height:58vh;font-size:17px;line-height:2.1;padding:24px 28px;background:#141923}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}.badge{color:var(--gold);background:#3b3224;padding:5px 9px;border-radius:5px;font-size:12px}.empty{border:1px dashed var(--border);border-radius:9px;padding:36px;text-align:center;color:var(--muted)}#toast{position:fixed;bottom:18px;right:18px;background:#2a302c;color:#e8d3a4;padding:10px 16px;border-radius:7px;display:none;z-index:10}.search{max-width:310px}.footer{font-size:12px;color:var(--muted);margin-top:30px}@media(max-width:800px){.shell{display:block}nav{width:100%;display:flex;overflow:auto;padding:8px}nav button{white-space:nowrap;width:auto}main{padding:20px 15px}.split{grid-template-columns:1fr}.brand{font-size:17px}header{padding:0 15px}.editor{min-height:45vh}}
</style></head><body><header><div class="brand">✦ NOVEL STUDIO</div><div class="muted">PRIVATE WRITING ATELIER · LOCAL · v0.5.0</div></header><div class="shell"><nav id="nav"></nav><main id="main"></main></div><div id="toast"></div><script>
const tabs=[['home','⌂ ダッシュボード'],['write','✒ 執筆エディター'],['ideas','✧ アイデア保管庫'],['plot','◇ プロット・伏線'],['settings','♜ 設定資料集']];let state={works:[],chapters:[],entries:[]},page='home',workId=null,chapterId=null,entryId=null,kind='ideas',saveTimer=null,seq=0;const $=s=>document.querySelector(s),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const work=()=>state.works.find(w=>w.id===workId),chapters=()=>state.chapters.filter(x=>x.work_id===workId).sort((a,b)=>a.position-b.position||a.id-b.id),entries=()=>state.entries.filter(x=>x.work_id===workId&&x.kind===kind);const el=(id)=>document.getElementById(id);function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}async function api(path,body,method='POST'){let r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.error||'通信エラー');return j}async function load(){let r=await fetch('/api/data');if(!r.ok)throw Error('データの読み込みに失敗');state=await r.json();if(!state.works.some(w=>w.id===workId))workId=state.works[0]?.id??null;if(!chapters().some(c=>c.id===chapterId))chapterId=chapters()[0]?.id??null;render()}function navigate(p){page=p;entryId=null;render()}function render(){el('nav').innerHTML=tabs.map(([id,name])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')">${name}</button>`).join('')+`<div style="padding:18px 10px"><div class="muted">現在の作品</div><select id="workSelect" onchange="changeWork(this.value)">${state.works.map(w=>`<option value="${w.id}" ${w.id===workId?'selected':''}>${escapeHtml(w.title)}</option>`).join('')}</select><button class="btn secondary" style="width:100%;margin-top:10px" onclick="newWork()">＋ 新しい作品</button></div>`;el('main').innerHTML=page==='home'?home():page==='write'?write():page==='ideas'?records('ideas'):page==='plot'?records('plot'):records('settings')}
function changeWork(id){workId=Number(id);chapterId=chapters()[0]?.id??null;entryId=null;render()}function home(){let ch=chapters(),words=ch.reduce((a,c)=>a+c.body.replace(/\s/g,'').length,0);return `<div class="topline"><div><h1>制作ダッシュボード</h1><div class="muted">物語のすべてを、ここに。</div></div><a class="btn secondary" href="/api/backup">↓ 全作品をZIPでバックアップ</a></div><div class="cards"><div class="card"><div class="muted">登録作品</div><div class="big">${state.works.length}</div></div><div class="card"><div class="muted">${work()?'現在の作品の話数':'話数'}</div><div class="big">${ch.length}</div></div><div class="card"><div class="muted">本文文字数（空白除く）</div><div class="big">${words.toLocaleString()}</div></div><div class="card"><div class="muted">保存したアイデア</div><div class="big">${state.entries.filter(x=>x.work_id===workId&&x.kind==='ideas').length}</div></div></div><div style="height:25px"></div><h2>作品一覧</h2><div class="cards">${state.works.map(w=>`<div class="card click" onclick="workId=${w.id};chapterId=chapters()[0]?.id??null;navigate('write')"><h2>${escapeHtml(w.title)}</h2><p>${escapeHtml(w.description||w.genre||'作品を開いて執筆を始める')}</p><span class="badge">執筆を開く →</span></div>`).join('')||'<div class="empty">まず作品を作成してください</div>'}</div>${work()?`<div class="footer"><button class="btn secondary" onclick="editWork()">作品情報を編集</button>　<button class="btn danger" onclick="deleteRecord('works',${workId})">作品を削除</button></div>`:''}`}
function write(){if(!work())return '<div class="empty">「新しい作品」から作品を作成してください</div>';let ch=chapters(),cur=ch.find(c=>c.id===chapterId);return `<div class="topline"><div><h1>執筆エディター</h1><div class="muted">${escapeHtml(work().title)}</div></div><button class="btn" onclick="newChapter()">＋ 新しい話</button></div><div class="split"><div class="list">${ch.map(c=>`<div class="item ${c.id===chapterId?'selected':''}" onclick="openChapter(${c.id})"><strong>${escapeHtml(c.title)}</strong><span class="muted">${c.body.replace(/\s/g,'').length}字 · ${escapeHtml(c.status)}</span></div>`).join('')||'<div class="empty">話を追加してください</div>'}</div><div>${cur?`<div class="toolbar"><input id="chTitle" style="flex:1;min-width:170px" value="${escapeHtml(cur.title)}" oninput="scheduleChapter()" placeholder="話のタイトル"><select id="chStatus" style="width:135px" onchange="scheduleChapter()">${['構想中','下書き','推敲中','完成','公開済み'].map(s=>`<option ${s===cur.status?'selected':''}>${s}</option>`).join('')}</select></div><textarea class="editor" id="chBody" oninput="scheduleChapter()" placeholder="ここから物語を紡ぐ…">${escapeHtml(cur.body)}</textarea><div class="toolbar"><span class="muted" id="count">${cur.body.replace(/\s/g,'').length.toLocaleString()}文字 / 目標4,500文字</span><span class="muted" id="saveState">保存済み</span></div><div class="flex"><button class="btn secondary" onclick="saveChapterNow()">今すぐ保存</button><button class="btn secondary" onclick="copyChapter()">本文をコピー</button><button class="btn danger" onclick="deleteRecord('chapters',${cur.id})">この話を削除</button></div>`:'<div class="empty">左の話を選択してください</div>'}</div></div>`}
function scheduleChapter(){let cur=state.chapters.find(x=>x.id===chapterId);if(!cur)return;cur.title=el('chTitle').value;cur.body=el('chBody').value;cur.status=el('chStatus').value;el('count').textContent=cur.body.replace(/\s/g,'').length.toLocaleString()+'文字 / 目標4,500文字';el('saveState').textContent='編集中…';clearTimeout(saveTimer);let id=cur.id,version=++seq;saveTimer=setTimeout(()=>saveChapter(id,version),650)}async function saveChapter(id,version){let c=state.chapters.find(x=>x.id===id);if(!c)return;try{await api('save',{table:'chapters',id,values:{title:c.title,body:c.body,status:c.status}});if(chapterId===id&&version===seq&&el('saveState'))el('saveState').textContent='保存済み'}catch(e){if(el('saveState'))el('saveState').textContent='保存失敗：再試行してください';toast(e.message)}}async function saveChapterNow(){clearTimeout(saveTimer);await saveChapter(chapterId,++seq);toast('保存処理を実行しました')}function copyChapter(){navigator.clipboard.writeText(el('chBody').value).then(()=>toast('本文をコピーしました')).catch(()=>toast('コピーできませんでした'))}async function openChapter(id){clearTimeout(saveTimer);let old=chapterId;if(old&&el('chBody'))await saveChapter(old,++seq);chapterId=id;render()}
function records(k){kind=k;if(!work())return '<div class="empty">まず作品を作成してください</div>';let labels={ideas:'アイデア保管庫',plot:'プロット・伏線管理',settings:'設定資料集'},list=entries(),selected=list.find(e=>e.id===entryId);return `<div class="topline"><div><h1>${labels[k]}</h1><div class="muted">${escapeHtml(work().title)}</div></div><button class="btn" onclick="newEntry()">＋ 新規追加</button></div><div class="split"><div><input id="filter" placeholder="タイトル・本文・タグを検索" oninput="filterEntries()"><div class="list" style="margin-top:12px" id="entryList">${entryList(list)}</div></div><div>${selected?`<div class="card"><label>タイトル</label><input id="eTitle" value="${escapeHtml(selected.title)}"><label>本文・詳細</label><textarea id="eBody" rows="12">${escapeHtml(selected.body)}</textarea><label>タグ・分類</label><input id="eTag" value="${escapeHtml(selected.tag)}" placeholder="例：人物、能力、未採用"><label>状態</label><select id="eStatus">${['未着手','検討中','採用予定','進行中','回収待ち','完了','使用済み'].map(s=>`<option ${s===selected.status?'selected':''}>${s}</option>`).join('')}</select><label>関連する話数・メモ</label><input id="eRef" value="${escapeHtml(selected.chapter_ref)}" placeholder="例：第71話"><div class="flex" style="margin-top:18px"><button class="btn" onclick="saveEntry()">保存</button><button class="btn danger" onclick="deleteRecord('entries',${selected.id})">削除</button></div></div>`:'<div class="empty">左から項目を選ぶか、新規追加してください</div>'}</div></div>`}
function entryList(list){return list.map(e=>`<div class="item ${e.id===entryId?'selected':''}" onclick="openEntry(${e.id})"><strong>${escapeHtml(e.title)}</strong><span class="muted">${escapeHtml(e.tag||'未分類')} · ${escapeHtml(e.status||'未着手')}</span></div>`).join('')||'<div class="empty">まだ項目がありません</div>'}function filterEntries(){let q=el('filter').value.toLowerCase();el('entryList').innerHTML=entryList(entries().filter(e=>(e.title+' '+e.body+' '+e.tag+' '+e.chapter_ref).toLowerCase().includes(q)))}function openEntry(id){entryId=id;render()}
async function newWork(){let title=prompt('作品タイトルを入力してください');if(!title?.trim())return;try{let r=await api('save',{table:'works',values:{title:title.trim()}});workId=r.id;chapterId=null;await load();navigate('write')}catch(e){toast(e.message)}}async function editWork(){let w=work(),title=prompt('作品タイトル',w.title);if(!title?.trim())return;let genre=prompt('ジャンル',w.genre)||'';let description=prompt('あらすじ・説明',w.description)||'';try{await api('save',{table:'works',id:w.id,values:{title:title.trim(),genre,description}});await load()}catch(e){toast(e.message)}}async function newChapter(){if(!workId)return;let title=prompt('話のタイトル','第'+(chapters().length+1)+'話');if(!title?.trim())return;try{let r=await api('save',{table:'chapters',values:{work_id:workId,title:title.trim(),position:chapters().length,status:'下書き'}});chapterId=r.id;await load()}catch(e){toast(e.message)}}async function newEntry(){let title=prompt('項目タイトルを入力してください');if(!title?.trim())return;try{let r=await api('save',{table:'entries',values:{work_id:workId,kind,title:title.trim(),status:'未着手'}});entryId=r.id;await load()}catch(e){toast(e.message)}}async function saveEntry(){let e=state.entries.find(x=>x.id===entryId);if(!e)return;try{await api('save',{table:'entries',id:e.id,values:{title:el('eTitle').value,body:el('eBody').value,tag:el('eTag').value,status:el('eStatus').value,chapter_ref:el('eRef').value}});await load();toast('保存しました')}catch(err){toast(err.message)}}async function deleteRecord(table,id){if(!confirm('削除しますか？ この操作は元に戻せません。事前にバックアップを推奨します。'))return;try{await api('delete',{table,id},'DELETE');if(table==='chapters')chapterId=null;if(table==='entries')entryId=null;await load();toast('削除しました')}catch(e){toast(e.message)}}window.addEventListener('beforeunload',e=>{if(saveTimer){e.preventDefault();e.returnValue=''}});load().catch(e=>{el('main').textContent=e.message});
</script></body></html>
